name: CI
on:
  push: {branches: [main]}
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # 和本地一样：真 Redis 跑一遍集成测试，确保 fakeredis 没掩盖问题
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check gateway worker tests
      - name: Unit tests (fakeredis)
        run: pytest -q
      - name: Integration tests (real Redis)
        env: {RELAY_USE_FAKE_REDIS: "false", RELAY_REDIS_URL: redis://localhost:6379/0}
        run: pytest -q tests/test_ratelimit.py tests/test_queue.py
      - name: Migration round-trip
        run: |
          cd gateway
          RELAY_DATABASE_URL=sqlite+aiosqlite:///ci.db alembic upgrade head
          RELAY_DATABASE_URL=sqlite+aiosqlite:///ci.db alembic downgrade base

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
