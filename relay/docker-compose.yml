# 一键起全套：docker compose up --build
# GPU worker：docker compose --profile gpu up --build（需要 nvidia-container-toolkit）
services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s}

  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: relay, POSTGRES_PASSWORD: relay, POSTGRES_DB: relay}
    ports: ["5432:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U relay"], interval: 5s}

  gateway:
    build: {context: ., dockerfile: gateway/Dockerfile}
    environment:
      RELAY_ENV: prod
      RELAY_DATABASE_URL: postgresql+asyncpg://relay:relay@postgres:5432/relay
      RELAY_REDIS_URL: redis://redis:6379/0
      RELAY_ADMIN_TOKEN: ${RELAY_ADMIN_TOKEN:-change-me}
    ports: ["8000:8000"]
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}

  worker:
    build: {context: ., dockerfile: worker/Dockerfile}
    environment:
      RELAY_ENV: prod
      RELAY_BACKEND: ${RELAY_BACKEND:-mock}
      RELAY_REDIS_URL: redis://redis:6379/0
      RELAY_DATABASE_URL: postgresql+asyncpg://relay:relay@postgres:5432/relay
    depends_on: {redis: {condition: service_healthy}}
    deploy: {replicas: 2}     # 两个 worker 演示水平扩展 + 崩溃接管

  worker-gpu:
    profiles: [gpu]
    build: {context: ., dockerfile: worker/Dockerfile.gpu}
    environment:
      RELAY_ENV: prod
      RELAY_BACKEND: vllm
      RELAY_MODEL_PROFILE: ${RELAY_MODEL_PROFILE:-balanced}
      RELAY_REDIS_URL: redis://redis:6379/0
      RELAY_DATABASE_URL: postgresql+asyncpg://relay:relay@postgres:5432/relay
    volumes: [hf-cache:/root/.cache/huggingface]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    depends_on: {redis: {condition: service_healthy}}

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: [./deploy/prometheus:/etc/prometheus:ro]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    environment: {GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Admin}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboard.json:/var/lib/grafana/dashboards/relay.json:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]

  web:
    # NEXT_PUBLIC_* 在构建时被内联进前端产物，必须走 build args；写在 environment 下运行期才注入，来不及
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${RELAY_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [gateway]

volumes:
  redis-data: {}
  pg-data: {}
  hf-cache: {}
